<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Organizador de cabos</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ddd;
        }

        .produto {
            width: 100%;
            border-radius: 10px;
        }

        h1 {
            font-size: 32px;
            margin: 20px 0 10px;
        }

        p {
            color: #666;
            font-size: 17px;
        }

        .preco {
            font-size: 30px;
            font-weight: bold;
            color: #008000;
            margin: 25px 0;
        }

        .botao {
            display: block;
            background: #ff6600;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .botao:hover {
            background: #e55b00;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Organizador de cabos</h1>
        <p>
            E um produto para aqueles que trabalham ou estudam no computador,
        ele  um imã que ajuda a organizar os seus cabos de baixo da mesa ou na parede.
        </p>

        <div class="preco">
            R$ 59,90
        </div>
        <a 
            class="botao"
            href="https://seu-checkout.com"
        >
            COMPRAR AGORA
        </a>

    </div>

</body>
</html>
